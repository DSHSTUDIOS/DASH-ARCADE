name: Publish Dash Arcade v2.4.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'DSHSTUDIOS/DASH-ARCADE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Assemble the signed APK and verify its checksum
        run: |
          node scripts/extract-preview-apk.mjs
          cp downloads/Dash-Arcade-v2-debug.apk Dash-Arcade-v2.4.1.apk
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCADE_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view v2.4.1 > /dev/null 2>&1; then
            gh release download v2.4.1 --pattern Dash-Arcade-v2.4.1.apk --output existing.apk
            cmp existing.apk Dash-Arcade-v2.4.1.apk
            exit
          fi
          gh release create v2.4.1 Dash-Arcade-v2.4.1.apk \
            --target "$ARCADE_RELEASE_COMMIT" \
            --title "Dash Arcade v2.4.1" \
            --notes "GuessSketch now draws from 80 simple one-word prompts across animals, objects, food, and places."
